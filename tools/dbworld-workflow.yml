# dbworld 저장소의 .github/workflows/build.yml 로 배포되는 워크플로
# (웹 관리자에서 글을 저장하면 이 워크플로가 사이트를 재생성해 반영)
name: build-site
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'assets/**'
      - 'build.mjs'
      - 'hyojunadmin/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build & prefix
        run: |
          node build.mjs
          node tools/prefix.mjs /dbworld
      - name: Publish (main root + gh-pages)
        run: |
          cp -r dist/. .
          rm -rf dist
          git config user.name "dbworld-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "사이트 자동 반영 [skip ci]" || echo "no changes"
          # 빌드 도중 관리자 저장이 끼어들면 최신 main 위로 올린 뒤 푸시 (끼어든 변경은 대기 중인 다음 실행이 다시 빌드)
          for i in 1 2 3; do
            git push origin main && break
            [ "$i" = 3 ] && exit 1
            git pull --rebase origin main || exit 1
          done
          git push -f origin main:gh-pages
